        <div class="panels-container" id="panelsContainer">
            <div class="panel left" id="panelLeft" onclick="choosePanel('left')">
                <span class="label">A</span><span class="quote" id="quoteLeft"></span>
            </div>
            <div class="panel right" id="panelRight" onclick="choosePanel('right')">

    <div class="result-screen" id="resultScreen">

                <div class="result-title" id="resultTitle"></div>

            <div class="result-quotes" id="resultQuotes"></div>
            <button class="btn" onclick="nextRound()">Sonraki Film ➜</button>
        </div>
    </div>
    <div class="game-over-screen" id="gameOverScreen">

            <h2>Oyun Bitti!</h2>

            <div class="final-message" id="finalMessage"></div>
            <button class="btn" onclick="restartGame()">🔄 Tekrar Oyna</button>

                        quoteOriginal: "You know what kind of plan never fails? No plan. No plan at all. You know why? Because life cannot be planned.",
                        character: "Ki-taek",
                        actor: "Song Kang-ho"
                    }
                ],
                fake: [
                    { quoteTr: "Bodrumda hepimiz aynı şekilde kokarız. Küf, diplomaya bakmaz. Nem, banka hesabınla ilgilenmez. Yer altının demokrasisi böyledir." },
                    { quoteTr: "Zenginler yukarı bakınca gökyüzünü görür, yıldızları görür. Biz yukarı bakınca havuzun dibini görürüz." },
                    { quoteTr: "Merdiven çok zalim bir yapı. Yukarı çıkarmayı vaat eder ama her adımını sayar." }
                ]
            },
            {
                id: "film_eskiya",
                titleTr: "Eşkıya",
                titleOriginal: "Eşkıya",
                year: 1996,
                director: "Yavuz Turgul",
                poster: "https://image.tmdb.org/t/p/w200/7nPGpKOm7xGqFRZx1nwuDG8GqZL.jpg",
                real: [
                    {
                        quoteTr: "İnsanın memleketi doğduğu yer değil, doyduğu yerdir derler. Ama doğduğun yerden başka neresi doyurabilir ki adamı?",
                        quoteOriginal: "İnsanın memleketi doğduğu yer değil, doyduğu yerdir derler. Ama doğduğun yerden başka neresi doyurabilir ki adamı?",
                        character: "Baran",
                        actor: "Şener Şen"
                    },
                    {
                        quoteTr: "Otuz beş yıl sonra bir dağ başında, bir başıma. Ne arayan var, ne soran.",
                        quoteOriginal: "Otuz beş yıl sonra bir dağ başında, bir başıma. Ne arayan var, ne soran.",
                        character: "Baran",
                        actor: "Şener Şen"
                    }
                ],
                fake: [
                    { quoteTr: "Hapishane dediğin dört duvar değil. Asıl hapishane, insanın kendi vicdanıdır. Oradan firar etmeye bir kez kalkıştın mı, bütün duvarlar zayıf gelir." },
                    { quoteTr: "Dağların bile birbirine selamı var. Rüzgarla gönderirler, yağmurla alırlar. İnsan insana selam vermez oldu. Dağlardan daha mı taşız biz?" },
                    { quoteTr: "Sen hiç bir insanı otuz beş yıl bekledin mi? Bekleme. Çünkü beklenen gelmez. Gelen, beklenmeyendir. Hayat böyle bir kumardır işte." }
                ]
            }
        ];

        // ══════════════════════════════════════
        // OYUN MOTORU
        // ══════════════════════════════════════
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let currentRealQuote = null;
        let currentFakeQuote = null;
        let currentRealSide = null;
        let answered = false;

        const els = {
            filmTitleTr: document.getElementById('filmTitleTr'),
            filmTitleOriginal: document.getElementById('filmTitleOriginal'),
            filmYear: document.getElementById('filmYear'),
            roundInfo: document.getElementById('roundInfo'),
            filmPoster: document.getElementById('filmPoster'),
            quoteLeft: document.getElementById('quoteLeft'),
            quoteRight: document.getElementById('quoteRight'),
            panelLeft: document.getElementById('panelLeft'),
            panelRight: document.getElementById('panelRight'),
            feedbackOverlay: document.getElementById('feedbackOverlay'),
            feedbackText: document.getElementById('feedbackText'),
            resultScreen: document.getElementById('resultScreen'),
            resultIcon: document.getElementById('resultIcon'),
            resultTitle: document.getElementById('resultTitle'),
            resultDetail: document.getElementById('resultDetail'),
            resultQuotes: document.getElementById('resultQuotes'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            correctCountEl: document.getElementById('correctCount'),
            wrongCountEl: document.getElementById('wrongCount'),
            progressFill: document.getElementById('progressFill')
        };

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function randomFromArray(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        let shuffledFilms = [];
        const TOTAL_ROUNDS = 10; // Kaç tur oynanacak

        function restartGame() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            answered = false;
            updateScores();
            els.gameOverScreen.classList.remove('active');
            els.resultScreen.classList.remove('active');
            els.feedbackOverlay.classList.remove('show');
            shuffledFilms = shuffleArray(gameData);
            loadRound();
        }

        function updateScores() {
            els.correctCountEl.textContent = correctCount;
            els.wrongCountEl.textContent = wrongCount;
            els.progressFill.style.width = (currentIndex / TOTAL_ROUNDS) * 100 + '%';
        }

        function loadRound() {
            if (currentIndex >= TOTAL_ROUNDS || shuffledFilms.length === 0) {
                showGameOver();
                return;
            }
            answered = false;
            els.resultScreen.classList.remove('active');
            els.feedbackOverlay.classList.remove('show');
            els.panelLeft.style.pointerEvents = 'auto';
            els.panelRight.style.pointerEvents = 'auto';
            els.panelLeft.style.opacity = '1';
            els.panelRight.style.opacity = '1';
            els.panelLeft.style.background = '';
            els.panelRight.style.background = '';

            const film = shuffledFilms[currentIndex % shuffledFilms.length];
            currentRealQuote = randomFromArray(film.real);
            currentFakeQuote = randomFromArray(film.fake);

            els.filmTitleTr.textContent = film.titleTr;
            els.filmTitleOriginal.textContent = film.titleOriginal;
            els.filmYear.textContent = film.year + ' · ' + film.director;
            els.roundInfo.textContent = (currentIndex + 1) + ' / ' + TOTAL_ROUNDS;
            els.filmPoster.src = film.poster;

            if (Math.random() < 0.5) {
                currentRealSide = 'left';
                els.quoteLeft.textContent = '"' + currentRealQuote.quoteTr + '"';
                els.quoteRight.textContent = '"' + currentFakeQuote.quoteTr + '"';
            } else {
                currentRealSide = 'right';
                els.quoteRight.textContent = '"' + currentRealQuote.quoteTr + '"';
                els.quoteLeft.textContent = '"' + currentFakeQuote.quoteTr + '"';
            }
            updateScores();
            els.resultQuotes.scrollTop = 0;
        }

        function choosePanel(side) {
            if (answered) return;
            answered = true;

            const film = shuffledFilms[currentIndex % shuffledFilms.length];
            const isCorrect = (side === currentRealSide);

            if (currentRealSide === 'left') {
                els.panelLeft.style.background = '#1a3a2a';
                els.panelRight.style.background = '#3a1a1a';
            } else {
                els.panelRight.style.background = '#1a3a2a';
                els.panelLeft.style.background = '#3a1a1a';
            }

            els.feedbackText.textContent = isCorrect ? '✓' : '✗';
            els.feedbackText.className = 'feedback-text ' + (isCorrect ? 'correct' : 'wrong');
            els.feedbackOverlay.classList.add('show');

            if (isCorrect) correctCount++;
            else wrongCount++;
            updateScores();

            els.panelLeft.style.pointerEvents = 'none';
            els.panelRight.style.pointerEvents = 'none';

            setTimeout(() => {
                els.feedbackOverlay.classList.remove('show');
                showResult(film, isCorrect);
            }, 700);
        }

        function showResult(film, isCorrect) {
            els.resultIcon.textContent = isCorrect ? '✅' : '❌';
            els.resultTitle.textContent = isCorrect ? 'Doğru bildiniz!' : 'Yanlış bildiniz!';
            els.resultDetail.textContent = film.titleTr + ' (' + film.titleOriginal + ', ' + film.year + ')';

            els.resultQuotes.innerHTML = `
                <div class="result-quote-block real">
                    <div class="tag real">✅ Gerçek Alıntı</div>
                    <div class="quote-text">"${currentRealQuote.quoteTr}"</div>
                    <div class="quote-original">"${currentRealQuote.quoteOriginal}"</div>
                    <div class="quote-character">— ${currentRealQuote.character} (${currentRealQuote.actor})</div>
                </div>
                <div class="result-quote-block fake">
                    <div class="tag fake">❌ Yapay Zeka</div>
                    <div class="quote-text">"${currentFakeQuote.quoteTr}"</div>
                    <div class="quote-original" style="color:#999;">Bu söz filmde geçmez. Yapay zeka tarafından üretilmiştir.</div>
                </div>
            `;

            els.resultQuotes.scrollTop = 0;
            els.resultScreen.classList.add('active');
        }

        function nextRound() {
            currentIndex++;
            loadRound();
        }

        function showGameOver() {
            const total = TOTAL_ROUNDS;
            const score = correctCount;
            let emoji, message;
            if (score === total) { emoji = '🏆'; message = 'Mükemmel! Tüm alıntıları doğru bildiniz. Gerçek bir sinema tutkunusunuz!'; }
            else if (score >= total * 0.8) { emoji = '🌟'; message = 'Harika! Filmleri iyi tanıyorsunuz. Sahte alıntıları yakalamakta ustasınız.'; }
            else if (score >= total * 0.6) { emoji = '🎬'; message = 'Fena değil! Bazı sahte alıntılar epey inandırıcıydı, değil mi?'; }
            else if (score >= total * 0.4) { emoji = '🍿'; message = 'Eh, idare eder. Yapay zeka bazen çok ikna edici olabiliyor.'; }
            else { emoji = '🤖'; message = 'Yapay zeka sizi kandırmış! Ama üzülmeyin, bu alıntıları ayırt etmek gerçekten zor.'; }

            document.getElementById('finalEmoji').textContent = emoji;
            document.getElementById('finalScoreText').textContent = score + ' / ' + total + ' Doğru';
            document.getElementById('finalMessage').textContent = message;
            els.gameOverScreen.classList.add('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') choosePanel('left');
            if (e.key === 'ArrowRight') choosePanel('right');
            if (e.key === 'Enter' && els.resultScreen.classList.contains('active')) nextRound();
            if ((e.key === 'r' || e.key === 'R') && els.gameOverScreen.classList.contains('active')) restartGame();
        });

        shuffledFilms = shuffleArray(gameData);
        loadRound();
    </script>
</body>
</html>
