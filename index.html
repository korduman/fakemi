<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hangisi Yapay Zeka?</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text: #f0f0f0;
            --accent: #e2b04a;
            --real-color: #4caf91;
            --fake-color: #c44b4b;
            --correct: #4caf91;
            --wrong: #c44b4b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex; flex-direction: column;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: #111; z-index: 10; flex-shrink: 0; gap: 8px;
        }
        .header .logo { font-size:0.95rem; font-weight:700; letter-spacing:0.5px; color:var(--accent); white-space:nowrap; }
        .header .score-area { display:flex; gap:8px; font-size:0.8rem; color:#ccc; white-space:nowrap; }
        .header .score-area .score-item { display:flex; align-items:center; gap:3px; }
        .header .score-area span { color:var(--accent); font-weight:700; }
        .progress-bar { height:2px; background:#333; flex-shrink:0; }
        .progress-fill { height:100%; background:var(--accent); transition:width 0.3s ease; }
        .game-container { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
        .film-info { text-align:center; padding:10px 12px 4px; flex-shrink:0; }
        .film-title-tr { font-size:1.2rem; font-weight:700; color:#fff; margin-bottom:1px; }
        .film-title-original { font-size:0.78rem; color:#999; font-style:italic; }
        .film-year { font-size:0.72rem; color:var(--accent); margin-top:1px; }
        .round-info { font-size:0.7rem; color:#666; margin-top:2px; }
        .poster-area { display:flex; justify-content:center; padding:4px 12px; flex-shrink:0; }
        .poster-area img { width:64px; height:96px; object-fit:cover; border-radius:6px; border:2px solid #444; box-shadow:0 3px 12px rgba(0,0,0,0.5); }
        .panels-container { flex:1; display:flex; gap:1px; background:#111; min-height:0; margin:6px 6px 0; border-radius:10px; overflow:hidden; }
        .panel { flex:1; display:flex; align-items:center; justify-content:center; padding:16px 10px; background:var(--panel-bg); cursor:pointer; transition:background 0.2s, transform 0.1s; text-align:center; position:relative; min-width:0; }
        .panel:active { transform:scale(0.97); }
        .panel .quote { font-size:0.92rem; line-height:1.55; color:#ddd; word-wrap:break-word; overflow-wrap:break-word; max-width:100%; }
        .panel .label { position:absolute; top:8px; font-size:0.65rem; text-transform:uppercase; letter-spacing:1.5px; color:#666; font-weight:700; }
        .panel.left .label { left:10px; } .panel.right .label { right:10px; }
        .feedback-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:50; opacity:0; transition:opacity 0.15s; }
        .feedback-overlay.show { opacity:1; }
        .feedback-text { font-size:4rem; font-weight:900; letter-spacing:2px; text-shadow:0 4px 30px rgba(0,0,0,0.8); }
        .feedback-text.correct { color:var(--correct); } .feedback-text.wrong { color:var(--wrong); }
        .result-screen { position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .result-screen.active { opacity:1; pointer-events:auto; }
        .result-card { background:#1e1e1e; border-radius:14px; padding:20px 16px 16px; max-width:420px; width:100%; max-height:85vh; max-height:85dvh; text-align:center; border:1px solid #333; display:flex; flex-direction:column; overflow:hidden; }
        .result-card .result-header { flex-shrink:0; }
        .result-icon { font-size:2.2rem; margin-bottom:4px; }
        .result-title { font-size:1.1rem; font-weight:700; margin-bottom:2px; color:#fff; }
        .result-detail { font-size:0.78rem; color:#aaa; margin-bottom:10px; line-height:1.4; }
        .result-quotes { text-align:left; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; margin-bottom:12px; padding:0 2px; min-height:0; }
        .result-quote-block { background:#252525; border-radius:8px; padding:10px 12px; margin-bottom:8px; border-left:3px solid #555; }
        .result-quote-block.real { border-left-color:var(--real-color); }
        .result-quote-block.fake { border-left-color:var(--fake-color); }
        .result-quote-block .tag { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:4px; }
        .tag.real { color:var(--real-color); } .tag.fake { color:var(--fake-color); }
        .result-quote-block .quote-text { font-size:0.85rem; color:#ddd; line-height:1.5; margin-bottom:4px; }
        .result-quote-block .quote-original { font-size:0.75rem; color:#888; font-style:italic; word-wrap:break-word; }
        .result-quote-block .quote-character { font-size:0.75rem; color:var(--accent); margin-top:3px; }
        .btn { display:inline-block; padding:12px 24px; border-radius:22px; font-size:0.95rem; font-weight:700; cursor:pointer; border:none; color:#000; background:var(--accent); transition:opacity 0.2s; flex-shrink:0; }
        .btn:hover { opacity:0.85; } .btn.secondary { background:#333; color:#fff; }
        .game-over-screen { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.4s; }
        .game-over-screen.active { opacity:1; pointer-events:auto; }
        .game-over-card { background:#1e1e1e; border-radius:18px; padding:26px 20px; max-width:380px; width:100%; text-align:center; border:1px solid #333; }
        .game-over-card .final-emoji { font-size:4rem; margin-bottom:8px; }
        .game-over-card h2 { font-size:1.4rem; margin-bottom:4px; color:#fff; }
        .game-over-card .final-score-text { font-size:1.2rem; color:var(--accent); font-weight:700; margin-bottom:4px; }
        .game-over-card .final-message { font-size:0.85rem; color:#aaa; margin-bottom:18px; line-height:1.5; }
        @media (max-width:380px) {
            .header .logo { font-size:0.82rem; } .header .score-area { font-size:0.7rem; gap:5px; }
            .panel .quote { font-size:0.82rem; } .film-title-tr { font-size:1.05rem; }
            .panel { padding:12px 8px; } .result-card { padding:14px 12px 12px; max-height:90dvh; }
            .result-quote-block .quote-text { font-size:0.78rem; } .btn { padding:10px 20px; font-size:0.9rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎬 Hangisi Yapay Zeka?</div>
        <div class="score-area">
            <span class="score-item">✅<span id="correctCount">0</span></span>
            <span class="score-item">❌<span id="wrongCount">0</span></span>
        </div>
    </div>

    <div class="game-container" id="gameContainer">

            <div class="round-info" id="roundInfo"></div>
        </div>
        <div class="poster-area">

        </div>
        <div class="panels-container" id="panelsContainer">
            <div class="panel left" id="panelLeft" onclick="choosePanel('left')">
                <span class="label">A</span><span class="quote" id="quoteLeft"></span>
            </div>
            <div class="panel right" id="panelRight" onclick="choosePanel('right')">
                <span class="label">B</span><span class="quote" id="quoteRight"></span>
            </div>
        </div>
    </div>
    <div class="feedback-overlay" id="feedbackOverlay"><span class="feedback-text" id="feedbackText"></span></div>
    <div class="result-screen" id="resultScreen">
        <div class="result-card">
            <div class="result-header">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-detail" id="resultDetail"></div>
            </div>
            <div class="result-quotes" id="resultQuotes"></div>
            <button class="btn" onclick="nextRound()">Sonraki Film ➜</button>
        </div>
    </div>
    <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-card">
            <div class="final-emoji" id="finalEmoji"></div>
            <h2>Oyun Bitti!</h2>
            <div class="final-score-text" id="finalScoreText"></div>
            <div class="final-message" id="finalMessage"></div>
            <button class="btn" onclick="restartGame()">🔄 Tekrar Oyna</button>
        </div>
    </div>

        // ══════════════════════════════════════
        // OYUN MOTORU
        // ══════════════════════════════════════
        let currentIndex = 0;

        let currentRealSide = null;
        let answered = false;
        const TOTAL_ROUNDS = 10;

        const els = {
            filmTitleTr: document.getElementById('filmTitleTr'),
            filmTitleOriginal: document.getElementById('filmTitleOriginal'),

            roundInfo: document.getElementById('roundInfo'),

            correctCountEl: document.getElementById('correctCount'),
            wrongCountEl: document.getElementById('wrongCount'),
            progressFill: document.getElementById('progressFill')
        };

        function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        function randomFromArray(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        let shuffledFilms = [];

        function restartGame() {
            currentIndex = 0; correctCount = 0; wrongCount = 0; answered = false;
            updateScores();
            els.gameOverScreen.classList.remove('active');
            els.resultScreen.classList.remove('active');
            els.feedbackOverlay.classList.remove('show');
            shuffledFilms = shuffleArray(gameData);
            loadRound();
        }

        function updateScores() {
            els.correctCountEl.textContent = correctCount;
            els.wrongCountEl.textContent = wrongCount;
            els.progressFill.style.width = (currentIndex / TOTAL_ROUNDS) * 100 + '%';
        }

        function loadRound() {
            if (currentIndex >= TOTAL_ROUNDS || shuffledFilms.length === 0) { showGameOver(); return; }
            answered = false;
            els.resultScreen.classList.remove('active');
            els.feedbackOverlay.classList.remove('show');
            els.panelLeft.style.pointerEvents = 'auto'; els.panelRight.style.pointerEvents = 'auto';
            els.panelLeft.style.opacity = '1'; els.panelRight.style.opacity = '1';
            els.panelLeft.style.background = ''; els.panelRight.style.background = '';

            const film = shuffledFilms[currentIndex % shuffledFilms.length];
            currentRealQuote = randomFromArray(film.real);
            currentFakeQuote = randomFromArray(film.fake);

            els.filmTitleTr.textContent = film.titleTr;
            els.filmTitleOriginal.textContent = film.titleOriginal;
            els.filmYear.textContent = film.year + ' · ' + film.director;
            els.roundInfo.textContent = (currentIndex + 1) + ' / ' + TOTAL_ROUNDS;
            els.filmPoster.src = film.poster;

            if (Math.random() < 0.5) {
                currentRealSide = 'left';
                els.quoteLeft.textContent = '"' + currentRealQuote.quoteTr + '"';
                els.quoteRight.textContent = '"' + currentFakeQuote.quoteTr + '"';
            } else {
                currentRealSide = 'right';
                els.quoteRight.textContent = '"' + currentRealQuote.quoteTr + '"';
                els.quoteLeft.textContent = '"' + currentFakeQuote.quoteTr + '"';
            }
            updateScores();
            els.resultQuotes.scrollTop = 0;
        }

        function choosePanel(side) {
            if (answered) return;
            answered = true;
            const film = shuffledFilms[currentIndex % shuffledFilms.length];
            const isCorrect = (side === currentRealSide);

            if (currentRealSide === 'left') { els.panelLeft.style.background = '#1a3a2a'; els.panelRight.style.background = '#3a1a1a'; }
            else { els.panelRight.style.background = '#1a3a2a'; els.panelLeft.style.background = '#3a1a1a'; }

            els.feedbackText.textContent = isCorrect ? '✓' : '✗';
            els.feedbackText.className = 'feedback-text ' + (isCorrect ? 'correct' : 'wrong');
            els.feedbackOverlay.classList.add('show');

            if (isCorrect) correctCount++; else wrongCount++;
            updateScores();
            els.panelLeft.style.pointerEvents = 'none'; els.panelRight.style.pointerEvents = 'none';

            setTimeout(() => { els.feedbackOverlay.classList.remove('show'); showResult(film, isCorrect); }, 700);
        }

        function showResult(film, isCorrect) {
            els.resultIcon.textContent = isCorrect ? '✅' : '❌';
            els.resultTitle.textContent = isCorrect ? 'Doğru bildiniz!' : 'Yanlış bildiniz!';
            els.resultDetail.textContent = film.titleTr + ' (' + film.titleOriginal + ', ' + film.year + ')';
            els.resultQuotes.innerHTML = `
                <div class="result-quote-block real">
                    <div class="tag real">✅ Gerçek Alıntı</div>
                    <div class="quote-text">"${currentRealQuote.quoteTr}"</div>
                    <div class="quote-original">"${currentRealQuote.quoteOriginal}"</div>
                    <div class="quote-character">— ${currentRealQuote.character} (${currentRealQuote.actor})</div>
                </div>
                <div class="result-quote-block fake">
                    <div class="tag fake">❌ Yapay Zeka</div>
                    <div class="quote-text">"${currentFakeQuote.quoteTr}"</div>
                    <div class="quote-original" style="color:#999;">Bu söz filmde geçmez. Yapay zeka tarafından üretilmiştir.</div>
                </div>
            `;
            els.resultQuotes.scrollTop = 0;
            els.resultScreen.classList.add('active');
        }

        function nextRound() { currentIndex++; loadRound(); }

        function showGameOver() {
            const total = TOTAL_ROUNDS; const score = correctCount;
            let emoji, message;
            if (score === total) { emoji = '🏆'; message = 'Mükemmel! Tüm alıntıları doğru bildiniz. Gerçek bir sinema tutkunusunuz!'; }
            else if (score >= total * 0.8) { emoji = '🌟'; message = 'Harika! Filmleri iyi tanıyorsunuz. Sahte alıntıları yakalamakta ustasınız.'; }
            else if (score >= total * 0.6) { emoji = '🎬'; message = 'Fena değil! Bazı sahte alıntılar epey inandırıcıydı, değil mi?'; }
            else if (score >= total * 0.4) { emoji = '🍿'; message = 'Eh, idare eder. Yapay zeka bazen çok ikna edici olabiliyor.'; }
            else { emoji = '🤖'; message = 'Yapay zeka sizi kandırmış! Ama üzülmeyin, bu alıntıları ayırt etmek gerçekten zor.'; }
            document.getElementById('finalEmoji').textContent = emoji;
            document.getElementById('finalScoreText').textContent = score + ' / ' + total + ' Doğru';
            document.getElementById('finalMessage').textContent = message;
            els.gameOverScreen.classList.add('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') choosePanel('left');
            if (e.key === 'ArrowRight') choosePanel('right');
            if (e.key === 'Enter' && els.resultScreen.classList.contains('active')) nextRound();
            if ((e.key === 'r' || e.key === 'R') && els.gameOverScreen.classList.contains('active')) restartGame();
        });

        shuffledFilms = shuffleArray(gameData);
        loadRound();
    </script>
</body>
</html>
